services:
  
  identity.database:
    image: postgres:latest
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - identity.database:/var/lib/postgresql/data:rw
    networks:
      - linguaPass.backend
  
  #----------------------------------------------
  
  course.database:
    image: postgres:latest
    environment:
      POSTGRES_DB: course
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - course.database:/var/lib/postgresql/data:rw
    networks:
      - linguaPass.backend
  
  #----------------------------------------------

  account.database:
    image: postgres:latest
    environment:
      POSTGRES_DB: account
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - account.database:/var/lib/postgresql/data:rw
    networks:
      - linguaPass.backend

volumes:
  identity.database:
  course.database:
  account.database:

networks:
  linguaPass.backend:
    driver: bridge